<!-- 氛围极光网格与阅读进度条 -->
<div class="ambient-backdrop" aria-hidden="true"></div>
<div id="reading-progress" aria-hidden="true"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  // 1. 阅读进度条
  const progressBar = document.getElementById("reading-progress");
  if (progressBar) {
    const updateProgress = () => {
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const pct = docHeight > 0 ? Math.min(100, Math.max(0, (window.scrollY / docHeight) * 100)) : 0;
      progressBar.style.width = pct + "%";
    };
    window.addEventListener("scroll", updateProgress, { passive: true });
    updateProgress();
  }

  // 2. 卡片鼠标聚光灯微光
  document.querySelectorAll(".spotlight-card").forEach((card) => {
    card.addEventListener("pointermove", (e) => {
      const rect = card.getBoundingClientRect();
      card.style.setProperty("--mouse-x", (e.clientX - rect.left) + "px");
      card.style.setProperty("--mouse-y", (e.clientY - rect.top) + "px");
    });
  });

  // 3. 吸顶目录滚动高亮
  const tocAside = document.querySelector(".article-toc-aside");
  if (tocAside) {
    const tocLinks = Array.from(tocAside.querySelectorAll("nav#TableOfContents a"));
    const headings = Array.from(document.querySelectorAll(".post-content h2[id], .post-content h3[id]"));
    if (tocLinks.length > 0 && headings.length > 0) {
      const activate = () => {
        let currentId = headings[0].id;
        for (const h of headings) {
          if (h.getBoundingClientRect().top <= 120) {
            currentId = h.id;
          } else {
            break;
          }
        }
        tocLinks.forEach((a) => {
          const href = decodeURIComponent(a.getAttribute("href") || "");
          const isMatch = href === "#" + currentId;
          a.classList.toggle("active", isMatch);
        });
      };
      window.addEventListener("scroll", activate, { passive: true });
      activate();
    }
  }

  // 4. 代码块语言标签与表格横向滚动容器
  document.querySelectorAll(".post-content .highlight").forEach((block) => {
    const pre = block.querySelector("pre");
    const code = block.querySelector("code");
    if (!pre) return;
    let lang = "";
    const checkClasses = (el) => {
      if (!el) return;
      el.className.split(/\s+/).forEach((cls) => {
        if (cls.startsWith("language-")) lang = cls.slice(9);
      });
    };
    checkClasses(block);
    if (!lang) checkClasses(code);
    if (lang) pre.setAttribute("data-lang", lang);
  });

  document.querySelectorAll(".post-content table").forEach((table) => {
    if (!table.parentElement.classList.contains("table-scroll")) {
      const wrap = document.createElement("div");
      wrap.className = "table-scroll";
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    }
  });

  // 5. 外链新标签打开
  document.querySelectorAll(".post-content a[href^='http']").forEach((a) => {
    try {
      if (new URL(a.href).hostname !== window.location.hostname) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
      }
    } catch (_) {}
  });

  // 6. 正文图片点击灯箱放大
  const imgs = document.querySelectorAll(".post-content img");
  if (imgs.length > 0) {
    const lightbox = document.createElement("div");
    lightbox.className = "img-lightbox";
    lightbox.innerHTML = '<img alt="">';
    const lbImg = lightbox.querySelector("img");
    document.body.appendChild(lightbox);

    const close = () => lightbox.classList.remove("open");
    lightbox.addEventListener("click", close);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") close();
    });

    imgs.forEach((img) => {
      img.addEventListener("click", () => {
        lbImg.src = img.currentSrc || img.src;
        lbImg.alt = img.alt || "";
        lightbox.classList.add("open");
      });
    });
  }

  // 7. 快捷键 '/' 直达搜索页
  document.addEventListener("keydown", (e) => {
    if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || document.activeElement.isContentEditable) return;
    const searchInput = document.getElementById("searchInput");
    if (searchInput) {
      e.preventDefault();
      searchInput.focus();
    } else {
      e.preventDefault();
      window.location.href = "{{ "/search/" | absLangURL }}";
    }
  });
});
</script>

<!-- Mermaid Diagrams Support -->
{{ if .Page.Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  const theme = document.documentElement.dataset.theme === 'light' ? 'default' : 'dark';
  mermaid.initialize({
    startOnLoad: true,
    theme,
    themeVariables: theme === 'dark' ? {
      primaryColor: '#111827',
      primaryTextColor: '#eef2f6',
      primaryBorderColor: '#38bdf8',
      lineColor: '#38bdf8',
      secondaryColor: '#1e293b',
      tertiaryColor: '#0f172a',
      background: '#0b1019',
      mainBkg: '#111827',
      secondBkg: '#1e293b',
      fontFamily: 'JetBrains Mono, Inter, sans-serif',
      fontSize: '14px'
    } : {}
  });
</script>
{{ end }}
