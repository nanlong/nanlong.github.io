{{ define "main" }}
<div class="error-shell">
  <h1 class="error-code">404</h1>
  <p class="hero-subtitle" style="margin-top: 14px; margin-bottom: 0;">
    目标页面不存在或已被移动。
  </p>

  <div class="error-terminal">
    <div><span style="color:#38bdf8">$</span> curl -I {{ .RelPermalink }}</div>
    <span class="err-out">HTTP/2 404 Not Found</span>
  </div>

  <div class="hero-cta" style="margin-bottom: 0;">
    <a class="btn-primary" href="{{ "" | absLangURL }}">返回首页</a>
    <a class="btn-secondary" href="{{ "/search/" | absLangURL }}">站内搜索</a>
  </div>
</div>
{{ end }}
